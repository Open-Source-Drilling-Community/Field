# Default values for osdcdrillingfieldservice.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
replicaCount: 1
strategy:
  # The service uses one SQLite database on the persistent volume. Do not overlap writers.
  type: Recreate
image:
  repository: docker.io/digiwells/osdcdrillingfieldservice
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "stable"
imagePullSecrets: []
nameOverride: "osdcdrillingfieldservice"
fullnameOverride: "osdcfieldservice"
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
podAnnotations: {}
podSecurityContext: {}
  # fsGroup: 2000
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000
service:
  type: ClusterIP
  port: 80
  annotations:
    description: "A microservice for handling field"
ingress:
  enabled: true
  className: public
  annotations:
    # Enable regex path matching for case-insensitive Field routes.
    nginx.ingress.kubernetes.io/use-regex: "true"
  hosts:
    - host: localhost
      paths:
        # Matches /field/api, /Field/api, and other casing variants.
        - path: /(?i)field/api
          pathType: ImplementationSpecific
    - host: dev.digiwells.no
      paths:
        - path: /(?i)field/api
          pathType: ImplementationSpecific
    - host: app.digiwells.no
      paths:
        - path: /(?i)field/api
          pathType: ImplementationSpecific
    - host: awe.web.intra.norceresearch.no
      paths:
        - path: /(?i)field/api
          pathType: ImplementationSpecific
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
nodeSelector: {}
tolerations: []
affinity: {}
probes:
  enabled: false
persistence:
  enabled: true
  # Set this to field-claim when adopting the existing production database PVC.
  existingClaim: ""
  claimName: field-claim
  accessModes:
    - ReadWriteMany
  size: 500Mi
# Reviewed legacy CartographicProjection UUID to EarthCartographicProjection
# projection-definition UUID mappings. Leave empty when no migration is needed.
projectionDefinitionIdMappings: {}
